services:
  # FastAPI backend
  - type: web
    name: edumentorai-api
    runtime: python
    rootDir: API
    plan: 1c-2g
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: http://localhost:5173,https://edumentorai-frontend.onrender.com

  # React static frontend
  - type: web
    name: edumentorai-frontend
    runtime: static
    buildCommand: cd Frontend && npm ci && npm run build
    staticPublishPath: ./Frontend/dist
    envVars:
      - key: VITE_API_BASE
        value: https://edumentorai-api.onrender.com/api
